{% extends "base.html" %}
{% block title %}Administration - MedicLab{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-6"
     x-data="adminLabos()"
     x-init="charger()">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Laboratoires</h1>
            <p class="text-sm text-slate-500 mt-1">Vue d'ensemble des comptes clients de la plateforme</p>
        </div>
        <div class="flex items-center gap-2">
            <button @click="exporter()" :disabled="!tous.length"
                    class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                📥 Exporter
            </button>
            <button @click="charger()"
                    class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors">
                🔄 Actualiser
            </button>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Laboratoires</p>
            <p class="text-3xl font-bold text-cyan-700 mt-2" x-text="loading ? '—' : tous.length"></p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Utilisateurs</p>
            <p class="text-3xl font-bold text-blue-700 mt-2" x-text="loading ? '—' : somme('nb_users')"></p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Patients</p>
            <p class="text-3xl font-bold text-green-700 mt-2" x-text="loading ? '—' : somme('nb_patients')"></p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Analyses</p>
            <p class="text-3xl font-bold text-purple-700 mt-2" x-text="loading ? '—' : somme('nb_analyses')"></p>
        </div>
    </div>

    <!-- Panel Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <!-- Toolbar -->
        <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
            <div class="relative w-full md:w-72">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" x-model="recherche" placeholder="Rechercher un laboratoire…"
                       class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>
            <p class="text-xs text-slate-500" x-text="listeFiltree().length + ' sur ' + tous.length + ' laboratoire(s)'"></p>
        </div>

        <!-- Loading Skeleton -->
        <template x-if="loading">
            <div class="p-6 space-y-3">
                <template x-for="i in 4">
                    <div class="flex items-center gap-4">
                        <div class="h-10 w-10 rounded-lg bg-slate-100 animate-pulse"></div>
                        <div class="flex-1 space-y-2">
                            <div class="h-4 w-1/3 bg-slate-100 rounded animate-pulse"></div>
                            <div class="h-3 w-1/6 bg-slate-100 rounded animate-pulse"></div>
                        </div>
                        <div class="h-4 w-12 bg-slate-100 rounded animate-pulse"></div>
                        <div class="h-4 w-12 bg-slate-100 rounded animate-pulse"></div>
                        <div class="h-4 w-12 bg-slate-100 rounded animate-pulse"></div>
                        <div class="h-6 w-16 bg-slate-100 rounded-full animate-pulse"></div>
                        <div class="h-6 w-20 bg-slate-100 rounded animate-pulse"></div>
                    </div>
                </template>
            </div>
        </template>

        <!-- Error State -->
        <template x-if="erreur">
            <div class="px-6 py-12 text-center">
                <p class="text-red-600 font-medium mb-3">⚠️ <span x-text="erreur"></span></p>
                <button @click="charger()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Réessayer</button>
            </div>
        </template>

        <!-- Empty State -->
        <template x-if="!loading && !erreur && listeFiltree().length === 0">
            <div class="px-6 py-12 text-center text-slate-400">
                <p x-text="tous.length ? 'Aucun laboratoire ne correspond à cette recherche.' : 'Aucun laboratoire enregistré pour le moment.'"></p>
            </div>
        </template>

        <!-- Table -->
        <template x-if="!loading && !erreur && listeFiltree().length > 0">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-3 font-semibold cursor-pointer select-none hover:text-blue-700" @click="trier('nom')">
                                Laboratoire <span x-show="tri.cle === 'nom'" x-text="tri.asc ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-6 py-3 font-semibold cursor-pointer select-none hover:text-blue-700" @click="trier('created_at')">
                                Inscription <span x-show="tri.cle === 'created_at'" x-text="tri.asc ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-6 py-3 font-semibold text-center cursor-pointer select-none hover:text-blue-700" @click="trier('nb_users')">
                                Utilisateurs <span x-show="tri.cle === 'nb_users'" x-text="tri.asc ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-6 py-3 font-semibold text-center cursor-pointer select-none hover:text-blue-700" @click="trier('nb_patients')">
                                Patients <span x-show="tri.cle === 'nb_patients'" x-text="tri.asc ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-6 py-3 font-semibold text-center cursor-pointer select-none hover:text-blue-700" @click="trier('nb_analyses')">
                                Analyses <span x-show="tri.cle === 'nb_analyses'" x-text="tri.asc ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-6 py-3 font-semibold text-center">Statut</th>
                            <th class="px-6 py-3 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="l in listeFiltree()" :key="l.id">
                            <tr class="hover:bg-slate-50/80 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <span class="w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold text-white shrink-0"
                                              :style="'background:' + couleur(l.id)"
                                              x-text="initiales(l.nom)"></span>
                                        <div>
                                            <p class="font-medium text-slate-900" x-text="l.nom"></p>
                                            <p class="text-xs text-slate-500" x-text="'#' + l.id"></p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-slate-500" x-text="l.created_at || '—'"></td>
                                <td class="px-6 py-4 text-center">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold"
                                          :class="(l.nb_users || 0) ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-400'"
                                          x-text="l.nb_users || 0"></span>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold"
                                          :class="(l.nb_patients || 0) ? 'bg-green-50 text-green-700' : 'bg-slate-100 text-slate-400'"
                                          x-text="l.nb_patients || 0"></span>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold"
                                          :class="(l.nb_analyses || 0) ? 'bg-purple-50 text-purple-700' : 'bg-slate-100 text-slate-400'"
                                          x-text="l.nb_analyses || 0"></span>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          :class="l.is_active ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'"
                                          x-text="l.is_active ? 'Actif' : 'Suspendu'"></span>
                                </td>
                                <td class="px-6 py-4 text-right space-x-1">
                                    <a :href="'/admin/labo/' + l.id"
                                       class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-cyan-700 hover:bg-cyan-50 transition-colors" title="Voir les données">
                                        👁️
                                    </a>
                                    <button @click="toggleLabo(l)"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg transition-colors"
                                            :class="l.is_active ? 'text-amber-600 hover:bg-amber-50' : 'text-green-600 hover:bg-green-50'"
                                            :title="l.is_active ? 'Suspendre' : 'Réactiver'">
                                        <span x-text="l.is_active ? '⏸️' : '▶️'"></span>
                                    </button>
                                    <button @click="supprimerLabo(l)"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-red-500 hover:bg-red-50 transition-colors" title="Supprimer">
                                        🗑️
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</div>

<script>
function adminLabos() {
    const PALETTE = ['#0e7490','#1d4ed8','#047857','#6d28d9','#b45309','#be123c','#0f766e','#4338ca'];
    return {
        tous: [],
        loading: true,
        erreur: '',
        recherche: '',
        tri: { cle: 'nom', asc: true },

        async charger() {
            this.loading = true;
            this.erreur = '';
            try {
                const r = await fetch('/api/admin/labos', { headers: { 'Accept': 'application/json' } });
                if (r.status === 401) { window.location.href = '/login?next=/admin'; return; }
                if (r.status === 403) { this.erreur = "Ce compte n'a pas les droits administrateur."; this.loading = false; return; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                this.tous = await r.json();
            } catch (e) {
                this.erreur = 'Impossible de charger les laboratoires (' + e.message + ')';
            } finally {
                this.loading = false;
            }
        },

        listeFiltree() {
            const q = this.recherche.trim().toLowerCase();
            let liste = q ? this.tous.filter(l => (l.nom || '').toLowerCase().includes(q)) : [...this.tous];
            const k = this.tri.cle;
            const dir = this.tri.asc ? 1 : -1;
            liste.sort((a, b) => {
                let x = a[k], y = b[k];
                if (k.startsWith('nb_')) { x = Number(x) || 0; y = Number(y) || 0; }
                else { x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase(); }
                return (x < y ? -1 : x > y ? 1 : 0) * dir;
            });
            return liste;
        },

        trier(cle) {
            this.tri = { cle, asc: this.tri.cle === cle ? !this.tri.asc : true };
        },

        somme(k) { return this.tous.reduce((s, l) => s + (Number(l[k]) || 0), 0); },

        initiales(nom) {
            return (nom || '?').trim().split(/\s+/).slice(0, 2).map(m => m[0] || '').join('').toUpperCase() || '?';
        },

        couleur(id) { return PALETTE[Math.abs(Number(id) || 0) % PALETTE.length]; },

        async toggleLabo(l) {
            if (!confirm('Changer le statut de ' + l.nom + ' ?')) return;
            try {
                const r = await fetch('/api/admin/labos/' + l.id + '/toggle', { method: 'POST' });
                if (!r.ok) throw new Error();
                await this.charger();
            } catch { alert('Erreur lors du changement de statut'); }
        },

        async supprimerLabo(l) {
            if (!confirm('Supprimer ' + l.nom + ' et TOUTES ses données ? Cette action est irréversible.')) return;
            try {
                const r = await fetch('/api/admin/labos/' + l.id, { method: 'DELETE' });
                if (!r.ok) throw new Error();
                await this.charger();
            } catch { alert('Erreur lors de la suppression'); }
        },

        exporter() {
            const entetes = ['id','nom','created_at','nb_users','nb_patients','nb_analyses','is_active'];
            const lignes = [entetes.join(';')].concat(
                this.tous.map(l => entetes.map(k => '"' + String(l[k] ?? '').replace(/"/g, '""') + '"').join(';'))
            );
            const blob = new Blob(['\ufeff' + lignes.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'laboratoires.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }
    };
}
</script>
{% endblock %}
