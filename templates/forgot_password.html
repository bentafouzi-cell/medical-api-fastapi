<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié - MedicLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 400px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    <script>
        (function () {
            const balise = document.querySelector('meta[name="csrf-token"]');
            if (!balise) return;
            const jeton = balise.content;
            const original = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                const methode = String(options.method || 'GET').toUpperCase();
                if (methode !== 'GET' && methode !== 'HEAD') {
                    options.headers = new Headers(options.headers || {});
                    options.headers.set('X-CSRF-Token', jeton);
                }
                return original.call(this, url, options);
            };
        })();
    </script>
</head>
<body>
    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            Mot de passe oublié
        </div>
        <div class="card-body">
            <form id="forgotForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
            </form>
            <div id="message" class="mt-3"></div>
            <div class="text-center mt-3">
                <a href="/login">Retour à la connexion</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/forgot-password?email=' + encodeURIComponent(email), {
                    method: 'POST'
                });
                const data = await response.json();
                messageDiv.innerHTML = `<div class="alert alert-info">${data.message}</div>`;
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Erreur de connexion</div>`;
            }
        });
    </script>
</body>
</html>
