<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicLab - Tableau de bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar { background-color: #0d6efd; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🏥 MedicLab SaaS</span>
            <a href="/login" class="btn btn-outline-light btn-sm" onclick="localStorage.removeItem('token')">Déconnexion</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Nouvelle Analyse
                    </div>
                    <div class="card-body">
                        <form id="analyseForm">
                            <div class="mb-3">
                                <label for="patient_id" class="form-label">ID Patient</label>
                                <input type="text" class="form-control" id="patient_id" required placeholder="Ex: PAT-123">
                            </div>
                            <div class="mb-3">
                                <label for="type_analyse" class="form-label">Type d'analyse</label>
                                <select class="form-select" id="type_analyse" required>
                                    <option value="">Choisir...</option>
                                    <option value="Sanguin">Sanguin</option>
                                    <option value="Urine">Urine</option>
                                    <option value="Radio">Radio</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Créer l'analyse</button>
                        </form>
                        <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        Historique des Analyses
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID Patient</th>
                                    <th>Type</th>
                                    <th>Statut</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">Aucune analyse pour l'instant.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = window.location.origin + '/api/analyses';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        async function chargerAnalyses() {
            const tableBody = document.getElementById('tableBody');
            try {
                const response = await fetch(apiUrl + '/toutes', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const analyses = await response.json();

                if (analyses.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Aucune analyse pour l\'instant.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';
                analyses.forEach(analyse => {
                    const row = `
                        <tr>
                            <td><strong>${analyse.patient_id}</strong></td>
                            <td>${analyse.type_analyse}</td>
                            <td><span class="badge bg-success">${analyse.statut}</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Erreur lors du chargement des analyses", error);
            }
        }

        document.getElementById('analyseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const patientId = document.getElementById('patient_id').value;
            const typeAnalyse = document.getElementById('type_analyse').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch(apiUrl + '/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ patient_id: patientId, type_analyse: typeAnalyse })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="alert alert-success">Analyse créée avec succès !</div>`;
                    document.getElementById('analyseForm').reset();
                    chargerAnalyses();
                    setTimeout(() => { messageDiv.innerHTML = ''; }, 3000);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Erreur de connexion au serveur.</div>`;
            }
        });

        document.addEventListener('DOMContentLoaded', chargerAnalyses);
    </script>
</body>
</html>
