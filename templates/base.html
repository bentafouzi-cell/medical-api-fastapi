<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedicLab{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js pour interactions légères -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Police Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animation douce pour les modals */
        dialog::backdrop { transition: opacity 0.2s ease; }
        dialog[open]::backdrop { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="hidden md:flex w-64 flex-col border-r bg-white fixed h-full z-10">
        <div class="p-6 text-xl font-bold text-blue-700 border-b flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            MedicLab
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-blue-50 hover:text-blue-700 transition-colors {% if request.url.path == '/' %}bg-blue-50 text-blue-700{% else %}text-slate-600{% endif %}">
                📊 Tableau de bord
            </a>
            <a href="/patients" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-blue-50 hover:text-blue-700 transition-colors {% if '/patients' in request.url.path %}bg-blue-50 text-blue-700{% else %}text-slate-600{% endif %}">
                👥 Patients
            </a>
            {% if current_user and current_user.is_admin %}
            <a href="/admin" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-blue-50 hover:text-blue-700 transition-colors {% if '/admin' in request.url.path %}bg-blue-50 text-blue-700{% else %}text-slate-600{% endif %}">
                ⚙️ Administration
            </a>
            {% endif %}
        </nav>
        <div class="p-4 border-t">
            <form action="/logout" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <button type="submit" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">
                    🚪 Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 min-h-screen">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
