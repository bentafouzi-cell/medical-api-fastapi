<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Patients - MedicLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">MedicLab</a>
            <div class="ms-auto">
                <a href="/logout" class="btn btn-outline-danger btn-sm">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Gestion des Patients</h2>
        
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Ajouter un Patient</h5>
                <form id="addPatientForm" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="nom" placeholder="Nom" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="prenom" placeholder="Prénom" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" id="age" placeholder="Âge">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="sexe">
                            <option value="" selected disabled>Sexe</option>
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Liste des Patients</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Âge</th>
                            <th>Sexe</th>
                            <th>Téléphone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', loadPatients);

    async function loadPatients() {
        const response = await fetch('/api/patients/list');
        const patients = await response.json();
        const tbody = document.getElementById('patientsTableBody');
        tbody.innerHTML = '';
        
        if (patients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Aucun patient enregistré.</td></tr>';
            return;
        }

        patients.forEach(p => {
            const row = `<tr>
                <td>${p.nom}</td>
                <td>${p.prenom}</td>
                <td>${p.age || '-'}</td>
                <td>${p.sexe || '-'}</td>
                <td>${p.telephone || '-'}</td>
                <td><button class="btn btn-sm btn-outline-primary">Voir</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    document.getElementById('addPatientForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            age: document.getElementById('age').value || null,
            sexe: document.getElementById('sexe').value || null,
            telephone: ''
        };

        const response = await fetch('/api/patients/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Patient ajouté !');
            document.getElementById('addPatientForm').reset();
            loadPatients();
        } else {
            alert('Erreur lors de l\'ajout.');
        }
    });
    </script>
</body>
</html>
