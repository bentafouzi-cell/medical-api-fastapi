<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Patients - MedicLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">MedicLab</a>
            <div class="ms-auto">
                <a href="/logout" class="btn btn-outline-danger btn-sm">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Gestion des Patients</h2>
        
        <!-- MESSAGE DE SUCCÈS SI PRÉSENT -->
        {% if request.query_params.get('success') %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            Patient ajouté avec succès !
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Ajouter un Patient</h5>
                <!-- FORMULAIRE STANDARD SANS JAVASCRIPT -->
                <form action="/api/patients/create" method="POST" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" name="nom" class="form-control" placeholder="Nom" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="prenom" class="form-control" placeholder="Prénom" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="age" class="form-control" placeholder="Âge">
                    </div>
                    <div class="col-md-2">
                        <select name="sexe" class="form-select">
                            <option value="" selected disabled>Sexe</option>
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Liste des Patients</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Âge</th>
                            <th>Sexe</th>
                            <th>Téléphone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTableBody">
                        <!-- Rempli par JS pour l'affichage dynamique, mais l'ajout se fait sans JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Juste pour charger la liste au démarrage (pas pour l'ajout)
    document.addEventListener('DOMContentLoaded', loadPatients);

    async function loadPatients() {
        const response = await fetch('/api/patients/list');
        const patients = await response.json();
        const tbody = document.getElementById('patientsTableBody');
        tbody.innerHTML = '';
        
        if (patients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Aucun patient enregistré.</td></tr>';
            return;
        }

        patients.forEach(p => {
            const row = `<tr>
                <td>${p.nom}</td>
                <td>${p.prenom}</td>
                <td>${p.age || '-'}</td>
                <td>${p.sexe || '-'}</td>
                <td>${p.telephone || '-'}</td>
                <td><button class="btn btn-sm btn-outline-primary">Voir</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }
    </script>
</body>
</html>
