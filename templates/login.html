<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - MedicLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 400px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .card-header { background-color: #0d6efd; color: white; border-radius: 10px 10px 0 0 !important; font-weight: bold; }
        .btn-primary { background-color: #0d6efd; border: none; }
        .btn-primary:hover { background-color: #0b5ed7; }
    </style>
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
</head>
<body>
    <div class="card">
        <div class="card-header text-center">
            🏥 MedicLab - Connexion
        </div>
        <div class="card-body p-4">
            
            {% if expired %}
            <div class="alert alert-warning" role="alert">
                Votre session a expiré. Reconnectez-vous pour continuer.
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <!-- FORMULAIRE STANDARD SANS JAVASCRIPT -->
            <form action="/api/auth/login" method="POST">
                <!-- Page a retrouver apres connexion (ex: /admin) -->
                <input type="hidden" name="next_url" value="{{ next or '/' }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <div class="mb-3">
                    <label class="form-label">Email Professionnel</label>
                    <!-- Le nom DOIT être 'username' pour OAuth2PasswordRequestForm -->
                    <input type="email" name="username" class="form-control" placeholder="nom@labo.ma" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <!-- Le nom DOIT être 'password' -->
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>

            <div class="text-center mt-3">
                <a href="/forgot-password" class="text-decoration-none text-muted small">Mot de passe oublié ?</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
